[package]
name = "equilizer"
version = "0.1.0"
description = "Lightweight, low-latency system-wide audio equalizer for Windows"
authors = ["Johnny"]
edition = "2021"

[lib]
name = "equilizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
biquad = "0.4"
crossbeam-channel = "0.5"

[profile.dev]
incremental = false
codegen-units = 1

[profile.dev.build-override]
opt-level = 0
codegen-units = 1

[profile.dev.package."*"]
opt-level = 0
codegen-units = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
